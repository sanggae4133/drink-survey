<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}음료조사{% endblock %}</title>
<style>
:root{--ink:#26221c;--muted:#75695a;--line:#e3ddd2;--bg:#f7f5f1;--panel:#fff;--accent:#7a4a21;--ok:#3e6b4f;--bad:#a33d2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
a{color:var(--accent)}
nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;text-decoration:none;color:var(--ink)}
nav a{text-decoration:none;font-size:14px}
nav .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
main{max-width:860px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:22px;margin:8px 0 16px}h2{font-size:17px;margin:26px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
.muted{color:var(--muted);font-size:13px}
.flash{background:#fff6df;border:1px solid #e5d5a1;border-radius:8px;padding:10px 14px;margin:12px 0;font-size:14px}
table{border-collapse:collapse;width:100%;font-size:14px;background:var(--panel)}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted)}
input,select,textarea,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
textarea{width:100%}
button{cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
form.inline{display:inline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.warn{color:var(--bad);border-color:var(--bad)}
.badge.accent{color:var(--accent);border-color:var(--accent)}
.tbl-scroll{overflow-x:auto}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px}
.num{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
{% if user %}
<nav>
  <a class="brand" href="/">☕ 음료조사</a>
  <a href="/surveys/new">조사 만들기</a>
  <a href="/cafes">카페</a>
  <a href="/schedules">스케줄</a>
  <a href="/me">내 설정</a>
  {% if user['role'] == 'admin' %}<a href="/admin/users">회원</a><a href="/admin/groups">그룹</a>{% endif %}
  <span class="right">
    {{ user['name'] }}
    <form class="inline" method="post" action="/logout"><button class="ghost">로그아웃</button></form>
  </span>
</nav>
{% endif %}
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
<footer class="muted" style="text-align:center;padding:16px;font-size:12px">
  <a href="https://github.com/sanggae4133/drink-survey" target="_blank" rel="noopener noreferrer" style="color:var(--muted)">☕ drink-survey · GitHub</a>
</footer>
</body>
</html>
